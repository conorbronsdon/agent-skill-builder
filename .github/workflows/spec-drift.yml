name: spec-drift
on:
  schedule:
    - cron: "0 15 * * 1" # Mondays 15:00 UTC
  workflow_dispatch:

permissions:
  issues: write
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Check pinned spec snapshot against live docs
        id: drift
        run: |
          python3 scripts/check_spec_freshness.py | tee drift.log
        continue-on-error: true
      - name: Open issue on drift
        if: steps.drift.outcome == 'failure'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh label create spec-drift --color D93F0B --description "Upstream skill specification changed or could not be verified" --force
          if gh issue list --label spec-drift --state open --json number --jq length | grep -qv '^0$'; then
            echo "open spec-drift issue already exists; skipping"
            exit 0
          fi
          gh issue create \
            --title "Spec check: frontmatter snapshot needs review" \
            --label spec-drift \
            --body "$(printf 'The weekly check found drift, staleness, or an unavailable upstream source while checking references/claude-code-frontmatter.md against https://code.claude.com/docs/en/skills.\n\n```\n%s\n```\n\nReview the cause. Update the snapshot date only after re-verifying field semantics, limits, and lifecycle behavior.' "$(cat drift.log)")"
